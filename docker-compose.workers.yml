services:
  zero-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./production.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      ZERO_TTS_WORKER_URL: http://zero-worker:8000
      ZERO_VIDEO_ENGINE_URL: http://wan-worker:8000
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      zero-worker:
        condition: service_healthy

  zero-worker:
    build:
      context: ./piper-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./.env.workers
    environment:
      PIPER_MODEL_DIR: /var/lib/zero-piper
      SEARXNG_URL: http://searxng:8080
    cpus: 1.0
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - piper-voice-cache:/var/lib/zero-piper
    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    env_file:
      - ./searxng/searxng.env
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      FORCE_OWNERSHIP: "true"
    cpus: 0.5
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -n "$$SEARXNG_SECRET" &&
          test "$$SEARXNG_SECRET" != "replace-with-a-long-random-secret" &&
          test "$${#SEARXNG_SECRET}" -ge 32 &&
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    expose:
      - "8080"

  # Optional NVIDIA/CUDA inference. Never enable without both ZERO Wan cost attestations.
  wan-worker:
    profiles: ["gpu"]
    build:
      context: ./gpu-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./.env.workers
    environment:
      WAN_OUTPUT_DIR: /data/zero-wan-jobs
      HF_HOME: /data/huggingface-cache
      HF_HUB_CACHE: /data/huggingface-cache/hub
      WAN_REQUIRE_PERSISTENT_STORAGE: "true"
    expose:
      - "8000"
    volumes:
      - wan-video-jobs:/data/zero-wan-jobs
      - wan-model-cache:/data/huggingface-cache
    gpus: all

volumes:
  piper-voice-cache:
  searxng-cache:
  wan-video-jobs:
  wan-model-cache:
