services:
  zero-worker:
    build:
      context: ./piper-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.workers
    environment:
      PIPER_MODEL_DIR: /var/lib/zero-piper
      SEARXNG_URL: http://searxng:8080
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - piper-voice-cache:/var/lib/zero-piper
    depends_on:
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://localhost:8080/
      FORCE_OWNERSHIP: "true"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    expose:
      - "8080"

  # Optional video inference. Start with:
  # docker compose --profile gpu up -d --build wan-worker
  wan-worker:
    profiles: ["gpu"]
    build:
      context: ./gpu-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.workers
    environment:
      WAN_OUTPUT_DIR: /data/zero-wan-jobs
      HF_HOME: /data/huggingface-cache
      HUGGINGFACE_HUB_CACHE: /data/huggingface-cache/hub
      WAN_REQUIRE_PERSISTENT_STORAGE: "true"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - wan-video-jobs:/data/zero-wan-jobs
      - wan-model-cache:/data/huggingface-cache
    gpus: all

volumes:
  piper-voice-cache:
  searxng-cache:
  wan-video-jobs:
  wan-model-cache:
