name: ZEROAIStudio
options:
  bundleIdPrefix: com.zeroaistudio
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "ZERO AI STUDIO"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "ZERO nutzt das Mikrofon für Spracherkennung und Audioaufnahmen."
    INFOPLIST_KEY_NSCameraUsageDescription: "ZERO nutzt die Kamera, wenn du Bilder oder Videos aufnehmen möchtest."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ZERO greift auf ausgewählte Medien zu, die du in deinen Projekten verwenden möchtest."
    PRODUCT_BUNDLE_IDENTIFIER: com.zeroaistudio.app
    CODE_SIGN_STYLE: Automatic
packages:
  ZeroCoreML:
    path: ../ZeroCoreML
targets:
  ZEROAIStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZeroCoreML
        product: ZeroCoreML
    settings:
      base:
        PRODUCT_NAME: "ZERO AI STUDIO"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_ZERO_APP_URL: "https://zero-ai-studio.onrender.com"
