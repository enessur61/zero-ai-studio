name: ZERO AI STUDIO CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This workflow validates the current commit. Obsolete runs may be cancelled;
# the full native iOS build is handled by its own workflow.
concurrency:
  # Keep one active validation run per PR/ref; newer commits supersede stale runs.
  group: zero-ai-studio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Playwright's pinned Chromium build supports Ubuntu 24.04, not the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
        env:
          POSTGRES_USER: zero
          POSTGRES_PASSWORD: zero-test-password
          POSTGRES_DB: zero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zero -d zero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Block committed local data and credential files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n');
          const forbidden = files.filter((file) =>
            file === '.env' ||
            (file.startsWith('.env.') && file !== '.env.example') ||
            file.endsWith('/zero-studio-db.json') ||
            file === 'zero-studio-db.json' ||
            ['.pem', '.key', '.p12', '.pfx', '.sqlite', '.db'].some((ext) => file.toLowerCase().endsWith(ext))
          );
          if (forbidden.length) {
            console.error('Forbidden local data or secret files are tracked:', forbidden);
            process.exit(1);
          }
          const archives = files.filter((file) => file.toLowerCase().endsWith('.zip'));
          if (archives.length) {
            console.error('Tracked ZIP archives are not allowed; CI does not open or inspect archive contents:', archives);
            process.exit(1);
          }
          console.log('No prohibited local database, credential, or ZIP archive files are tracked.');
          NODE
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.24.2'
      - name: Scan repository content and git history for leaked secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.2 git --redact --no-banner .
      - run: npm ci --no-audit --no-fund
      - name: Verify Gemini calls are blocked unless free-only billing is confirmed
        shell: bash
        run: |
          GEMINI_API_KEY=ci-dummy-key ZERO_GEMINI_FREE_TIER_ONLY=false node --import tsx --input-type=module <<'NODE'
          import { getGeminiClient } from './server/geminiClient.ts';
          let blocked = false;
          try {
            getGeminiClient();
          } catch (error) {
            blocked = String(error).includes('ZERO_GEMINI_FREE_TIER_ONLY=true');
          }
          if (!blocked) throw new Error('Gemini API was not blocked without explicit free-only billing confirmation');
          console.log('Gemini API correctly blocked until billing-disabled confirmation.');
          NODE
      - run: npm run lint
      - run: npm test
      - name: Test persistent GPU worker job storage
        run: python3 gpu-worker/test_job_store.py
      - name: Test authenticated Wan worker API lifecycle without GPU inference
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r gpu-worker/test-requirements.txt
          python3 gpu-worker/test_worker_api.py
      - name: Install and validate the pinned Piper worker runtime
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r piper-worker/requirements.txt
          python3 -c "from piper import PiperVoice, SynthesisConfig; print('Piper runtime API import passed')"
          python3 piper-worker/test_voice_assets.py
      - name: Verify Piper model cache and run real local CPU synthesis without AI providers
        env:
          PIPER_MODEL_DIR: /tmp/zero-piper-cache-tests
        run: |
          (cd piper-worker && python3 -m unittest -v test_model_cache test_idempotency)
          python3 piper-worker/test_local_synthesis.py
      - name: Prepare QEMU for offline ARM64 Piper synthesis
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - name: Run real Piper synthesis on ARM64 with network disabled
        env:
          PIPER_MODEL_DIR: /tmp/zero-piper-cache-tests
        run: |
          docker buildx create --name zero-piper-arm64-offline --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build --platform linux/arm64 --load --tag zero-piper-arm64:offline ./piper-worker
          docker run --rm --platform linux/arm64 --network none \
            --volume "$PIPER_MODEL_DIR:/var/lib/zero-piper:ro" \
            --volume "$PWD/piper-worker/test_offline_synthesis.py:/app/test_offline_synthesis.py:ro" \
            --env PIPER_MODEL_DIR=/var/lib/zero-piper \
            zero-piper-arm64:offline python -m unittest -v test_offline_synthesis
      - name: Validate Piper and GPU worker Python syntax
        run: python3 -m py_compile piper-worker/app.py piper-worker/voice_assets.py gpu-worker/app.py
      - name: Run PostgreSQL revision and concurrency integration tests
        env:
          DATABASE_URL: postgres://zero:zero-test-password@localhost:5432/zero_test
          ZERO_POSTGRES_TESTS: 'true'
        run: |
          npx tsx tests/postgresRevisionConcurrency.integration.test.ts
          npx tsx tests/projectDeletionIdempotency.integration.test.ts
      - name: Run ZERO RESOURCE GUARD PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://zero:zero-test-password@localhost:5432/zero_test
          ZERO_POSTGRES_TESTS: 'true'
        run: npx tsx tests/zeroResourceGuard.integration.test.ts
      - run: npm run build
      - name: Install free Chromium browser for UI E2E
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Production server smoke test
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ENV=(NODE_ENV=production DATABASE_URL=postgres://zero:zero-test-password@localhost:5432/zero_test GEMINI_API_KEY=ci-dummy-key ZERO_GEMINI_FREE_TIER_ONLY=false ZERO_ADMIN_PASSWORD=zero-ci-password-123 ZERO_SESSION_SECRET=zero-ci-session-secret-012345678901234567890123456789 ZERO_COST_GUARD_DAILY_REQUEST_LIMIT=1000)
          env "${COMMON_ENV[@]}" PORT=4179 npm start > /tmp/zero-server-a.log 2>&1 &
          SERVER_PID_A=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- ZERO SERVER A LOG ---"; cat /tmp/zero-server-a.log; echo "--- ZERO SERVER B LOG ---"; cat /tmp/zero-server-b.log; fi; kill "${SERVER_PID_A:-}" "${SERVER_PID_B:-}" 2>/dev/null || true; exit "$status"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4179/api/health > /tmp/zero-health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID_A" 2>/dev/null; then
              cat /tmp/zero-server-a.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/zero-health.json
          ZERO_E2E_BASE_URL=http://127.0.0.1:4179 ZERO_E2E_PASSWORD=zero-ci-password-123 node tests/browserStudio.e2e.mjs
          env "${COMMON_ENV[@]}" PORT=4180 npm start > /tmp/zero-server-b.log 2>&1 &
          SERVER_PID_B=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4180/api/health > /tmp/zero-health-b.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID_B" 2>/dev/null; then
              cat /tmp/zero-server-b.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/zero-health-b.json
          node -e "const h=require('/tmp/zero-health.json'); if(!h.ok || h.app !== 'ZERO AI STUDIO' || h.maxVideoDurationSec !== 60 || h.readiness?.database !== 'ready' || h.readiness?.authentication !== 'ready') process.exit(1); console.log(JSON.stringify(h))"
          for asset in /manifest.webmanifest /sw.js /icons/apple-touch-icon.png; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4179$asset"
          done
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:4179';
          const baseB = 'http://127.0.0.1:4180';
          const unauthenticated = await fetch(base + '/api/projects');
          if (unauthenticated.status !== 401) throw new Error('Private API is accessible without login');
          const authStatus = await fetch(base + '/api/auth/status');
          const authInfo = await authStatus.json();
          if (!authInfo.required || !authInfo.configured || authInfo.authenticated) throw new Error('Production auth status is incorrect');
          const badLogin = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (badLogin.status !== 401) throw new Error('Invalid password was not rejected');
          const login = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'zero-ci-password-123' })
          });
          if (!login.ok) throw new Error('Production login failed');
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          if (!cookie) throw new Error('Login did not set a session cookie');
          const authFetch = (path, options = {}) => fetch(base + path, {
            ...options,
            headers: { 'content-type': 'application/json', ...(options.headers ?? {}), cookie }
          });
          const authenticatedStatus = await authFetch('/api/auth/status');
          const authenticatedInfo = await authenticatedStatus.json();
          if (!authenticatedInfo.authenticated) throw new Error('Session cookie rejected: ' + JSON.stringify(authenticatedInfo));

          // Real HTTP E2E for the production-authenticated ZERO COST GUARD control.
          // This runs against the live CI server process and the CI-local PostgreSQL service;
          // it never contacts either AI provider.
          const costGuardPath = '/api/system/cost-guard/pause';
          const unauthenticatedCostGuard = await fetch(base + costGuardPath, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: base },
            body: JSON.stringify({ paused: true })
          });
          if (unauthenticatedCostGuard.status !== 401) {
            throw new Error('Unauthenticated cost-guard mutation must be rejected before route handling: ' + unauthenticatedCostGuard.status);
          }
          const missingOriginCostGuard = await authFetch(costGuardPath, {
            method: 'POST', body: JSON.stringify({ paused: true })
          });
          if (missingOriginCostGuard.status !== 403) {
            throw new Error('Authenticated cost-guard mutation without Origin must return 403: ' + missingOriginCostGuard.status);
          }
          const foreignOriginCostGuard = await authFetch(costGuardPath, {
            method: 'POST',
            headers: { origin: 'https://attacker.example' },
            body: JSON.stringify({ paused: true })
          });
          if (foreignOriginCostGuard.status !== 403) {
            throw new Error('Authenticated cost-guard mutation with foreign Origin must return 403: ' + foreignOriginCostGuard.status);
          }
          const sameOriginPause = await authFetch(costGuardPath, {
            method: 'POST',
            headers: { origin: new URL(base).origin },
            body: JSON.stringify({ paused: true })
          });
          if (!sameOriginPause.ok) {
            throw new Error('Authenticated same-origin pause failed: ' + sameOriginPause.status + ' ' + await sameOriginPause.text());
          }
          const pausedOnSecondInstance = await fetch(baseB + '/api/system/cost-guard', {
            headers: { cookie }
          });
          const pausedStatus = await pausedOnSecondInstance.json();
          if (!pausedOnSecondInstance.ok || pausedStatus.paused !== true) {
            throw new Error('Pause state was not persisted and visible through the second server instance: ' + JSON.stringify(pausedStatus));
          }
          const sameOriginResume = await authFetch(costGuardPath, {
            method: 'POST',
            headers: { origin: new URL(base).origin },
            body: JSON.stringify({ paused: false })
          });
          if (!sameOriginResume.ok) {
            throw new Error('Authenticated same-origin resume failed: ' + sameOriginResume.status + ' ' + await sameOriginResume.text());
          }
          const resumedOnSecondInstance = await fetch(baseB + '/api/system/cost-guard', {
            headers: { cookie }
          });
          const resumedStatus = await resumedOnSecondInstance.json();
          if (!resumedOnSecondInstance.ok || resumedStatus.paused !== false) {
            throw new Error('Resume state was not persisted and visible through the second server instance: ' + JSON.stringify(resumedStatus));
          }
          console.log('Verified real HTTP cost-guard E2E: authenticated same-origin pause/resume, missing/foreign Origin rejection, unauthenticated rejection, and PostgreSQL persistence across two server instances.');
          const crossInstanceLogin = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'zero-ci-password-123' })
          });
          const crossInstanceCookie = crossInstanceLogin.headers.get('set-cookie')?.split(';')[0];
          if (!crossInstanceLogin.ok || !crossInstanceCookie) throw new Error('Second production login failed');
          const crossInstanceAccess = await fetch(baseB + '/api/projects', { headers: { cookie: crossInstanceCookie } });
          if (!crossInstanceAccess.ok) throw new Error('A session created on instance A was not accepted by instance B');
          const crossInstanceLogout = await fetch(baseB + '/api/auth/logout', {
            method: 'POST', headers: { cookie: crossInstanceCookie }
          });
          if (!crossInstanceLogout.ok) throw new Error('Logout on instance B failed');
          const revokedOnA = await fetch(base + '/api/projects', { headers: { cookie: crossInstanceCookie } });
          if (revokedOnA.status !== 401) throw new Error('Logout on instance B did not revoke the session on instance A');
          const securityHeaders = await fetch(base + '/api/health');
          for (const header of ['x-content-type-options', 'referrer-policy', 'x-frame-options', 'permissions-policy', 'content-security-policy-report-only', 'strict-transport-security']) {
            if (!securityHeaders.headers.get(header)) throw new Error('Missing security header: ' + header);
          }
          if (securityHeaders.headers.has('x-powered-by')) throw new Error('Express X-Powered-By header must be disabled');
          const unknownApi = await authFetch('/api/this-route-does-not-exist');
          if (unknownApi.status !== 404 ||
              !(unknownApi.headers.get('content-type') ?? '').includes('application/json') ||
              !(await unknownApi.json()).error) {
            throw new Error('Unknown API routes must return JSON 404, not the SPA fallback');
          }
          for (let attempt = 0; attempt < 8; attempt++) {
            const rateBase = attempt % 2 === 0 ? base : baseB;
            const limited = await fetch(rateBase + '/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.10' },
              body: JSON.stringify({ password: 'incorrect-ci-password' })
            });
            if (limited.status !== 401) throw new Error('Shared login rate limit triggered too early across production instances');
          }
          const blockedIp = await fetch(baseB + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.10' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (blockedIp.status !== 429) throw new Error('Shared login rate limit did not block the ninth attempt on the other instance');
          const independentIp = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.11' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (independentIp.status !== 401) throw new Error('Login rate limit is shared across different forwarded client IPs');
          const durationResponse = await authFetch('/api/projects', {
            method: 'POST',
            body: JSON.stringify({
              title: 'CI 60-second cap test',
              scenes: Array.from({ length: 16 }, (_, index) => ({ id: 'scene-' + index, durationSec: 5, imageUrl: 'javascript:alert(1)', audioDataUrl: 'data:text/html;base64,PHNjcmlwdD4=' }))
            })
          });
          if (!durationResponse.ok) throw new Error('Project duration cap endpoint failed: ' + durationResponse.status + ' ' + await durationResponse.text());
          const { project: durationProject } = await durationResponse.json();
          const totalDuration = durationProject.scenes.reduce((sum, scene) => sum + scene.durationSec, 0);
          if (totalDuration > 60) throw new Error('Film duration exceeded hard 60-second cap: ' + totalDuration);
          if (durationProject.scenes.some((scene) => scene.imageUrl !== undefined || scene.audioDataUrl !== undefined) ||
              durationProject.snapshots[0].state.scenes.some((scene) => scene.imageUrl !== undefined || scene.audioDataUrl !== undefined)) {
            throw new Error('Project creation persisted unsafe scene media URLs');
          }
          if (durationProject.targetDurationSec !== totalDuration ||
              durationProject.snapshots[0].sceneCount !== durationProject.scenes.length ||
              durationProject.snapshots[0].totalDurationSec !== totalDuration) {
            throw new Error('Project duration metadata does not match its clamped timeline');
          }
          const mp4Bytes = Buffer.alloc(8 * 1024 * 1024 + 1, 0);
          mp4Bytes.write('ftyp', 4, 'ascii');
          const sceneVideoPath = '/api/projects/' + durationProject.id + '/scenes/' + durationProject.scenes[0].id + '/video';
          const mediaWrite = await fetch(base + sceneVideoPath, {
            method: 'PUT', headers: { cookie, 'content-type': 'application/octet-stream', 'x-zero-video-type': 'video/mp4' }, body: mp4Bytes
          });
          const mediaWritePayload = await mediaWrite.json();
          if (!mediaWrite.ok || !mediaWritePayload.serverPersisted || mediaWritePayload.asset?.sizeBytes !== mp4Bytes.length) {
            throw new Error('Scene clip was not persisted to the ZERO PostgreSQL video archive: HTTP ' + mediaWrite.status + ' ' + JSON.stringify(mediaWritePayload));
          }
          const mediaReadFromSecondInstance = await fetch(baseB + sceneVideoPath, { headers: { cookie } });
          const mediaBytesFromSecondInstance = Buffer.from(await mediaReadFromSecondInstance.arrayBuffer());
          if (!mediaReadFromSecondInstance.ok || !mediaBytesFromSecondInstance.equals(mp4Bytes)) {
            throw new Error('Binary scene media written on instance A was not visible on instance B');
          }
          const clipHistoryResponse = await fetch(baseB + '/api/projects/' + durationProject.id + '/videos', { headers: { cookie } });
          const clipHistory = await clipHistoryResponse.json();
          const archivedClip = clipHistory.assets?.find((asset) => asset.id === mediaWritePayload.asset.id);
          if (!clipHistoryResponse.ok || !archivedClip || archivedClip.sizeBytes !== mp4Bytes.length) {
            throw new Error('Archived clip history was not shared across PostgreSQL-backed instances');
          }
          const clipDownload = await fetch(baseB + '/api/projects/' + durationProject.id + '/videos/' + archivedClip.id + '?download=1', { headers: { cookie } });
          const downloadedClip = Buffer.from(await clipDownload.arrayBuffer());
          if (!clipDownload.ok || !downloadedClip.equals(mp4Bytes) || !clipDownload.headers.get('content-disposition')?.includes('attachment')) {
            throw new Error('Archived project clip download failed');
          }
          if (!durationProject.snapshots[0].state ||
              durationProject.snapshots[0].state.scenes.length !== durationProject.scenes.length) {
            throw new Error('New projects must store a complete, restorable initial snapshot');
          }
          const editedProjectResponse = await authFetch('/api/projects/' + durationProject.id, {
            method: 'PUT',
            body: JSON.stringify({
              title: 'CI edited project',
              scenes: durationProject.scenes.slice(0, 1).map((scene) => ({ ...scene, imageUrl: 'javascript:alert(1)', audioDataUrl: 'data:text/html;base64,PHNjcmlwdD4=' })),
              snapshotNote: 'CI snapshot restore test',
              id: 'attacker-controlled-id',
              createdAt: '2000-01-01T00:00:00.000Z',
              updatedAt: '2000-01-01T00:00:00.000Z',
              version: 999999,
              targetDurationSec: 999999,
              snapshots: [],
              assets: [{ id: 'forged-asset', type: 'image', title: 'Injected', url: 'javascript:alert(1)', modelId: 'attacker', createdAt: '2000-01-01T00:00:00.000Z' }],
              status: 'HACKED'
            })
          });
          if (!editedProjectResponse.ok) throw new Error('Project edit for snapshot test failed');
          const editedProject = (await editedProjectResponse.json()).project;
          if (editedProject.id !== durationProject.id ||
              editedProject.createdAt !== durationProject.createdAt ||
              editedProject.version !== durationProject.version + 1 ||
              editedProject.targetDurationSec > 60 ||
              editedProject.status !== durationProject.status ||
              editedProject.assets.length !== durationProject.assets.length ||
              editedProject.snapshots.length === 0 ||
              editedProject.updatedAt === '2000-01-01T00:00:00.000Z' ||
              editedProject.scenes[0]?.imageUrl !== undefined ||
              editedProject.scenes[0]?.audioDataUrl !== undefined) {
            throw new Error('Project update accepted client-controlled server fields or unsafe scene media URLs: ' + JSON.stringify({ editedId: editedProject.id, expectedId: durationProject.id, editedVersion: editedProject.version, expectedVersion: durationProject.version + 1, editedAssets: editedProject.assets?.length, expectedAssets: durationProject.assets?.length, editedStatus: editedProject.status, expectedStatus: durationProject.status }));
          }
          const unsafeJavascriptAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'javascript:alert(1)' })
          });
          if (unsafeJavascriptAsset.status !== 400) throw new Error('javascript: project asset URL was not rejected');
          const unsafeHtmlAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'data:text/html;base64,PHNjcmlwdD4=' })
          });
          if (unsafeHtmlAsset.status !== 400) throw new Error('HTML data URL was not rejected as an image asset');
          const safeImageAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'data:image/png;base64,AAAA' })
          });
          if (!safeImageAsset.ok) throw new Error('Valid PNG data URL was rejected as a project asset');
          const snapshotToRestore = editedProject.snapshots.find((snapshot) => snapshot.state);
          if (!snapshotToRestore) throw new Error('Project edit did not create a restorable snapshot');
          const restoreResponse = await authFetch(
            '/api/projects/' + durationProject.id + '/snapshots/' + snapshotToRestore.id + '/restore',
            { method: 'POST' }
          );
          if (!restoreResponse.ok) throw new Error('Project snapshot restore endpoint failed: ' + await restoreResponse.text());
          const restoredProject = (await restoreResponse.json()).project;
          if (restoredProject.title !== durationProject.title ||
              restoredProject.scenes.length !== durationProject.scenes.length ||
              restoredProject.version <= editedProject.version ||
              !restoredProject.snapshots[0].state) {
            throw new Error('Project snapshot restore did not restore content and preserve a safety snapshot');
          }
          const removedLegacyModel = await authFetch('/api/models/gemini-3.7-flash/test', { method: 'POST' });
          if (removedLegacyModel.status !== 404) {
            throw new Error('Deprecated Gemini alias is still exposed by the API');
          }
          const billingGateResponse = await authFetch('/api/models/gemini-3.8-flash/test', { method: 'POST' });
          const billingGate = await billingGateResponse.json();
          if (!billingGateResponse.ok || billingGate.model?.status !== 'INSTALLATION ERFORDERLICH' ||
              !billingGate.model?.lastTestMessage?.includes('ZERO_GEMINI_FREE_TIER_ONLY=true')) {
            throw new Error('Gemini billing safety gate is not clearly enforced: ' + JSON.stringify(billingGate));
          }
          const modelResponse = await authFetch('/api/models');
          if (!modelResponse.ok) throw new Error('Model catalog endpoint failed: ' + modelResponse.status + ' ' + await modelResponse.text());
          const { models } = await modelResponse.json();
          const localProbe = await authFetch('/api/models/zero-canvas-img2img/test', { method: 'POST' });
          if (!localProbe.ok) throw new Error('Local browser adapter probe failed');
          const localProbeData = await localProbe.json();
          if (localProbeData.model.status !== 'BROWSER TEST ERFORDERLICH' || localProbeData.model.testPassed) {
            throw new Error('Server falsely marked a browser-only adapter as verified: ' + JSON.stringify(localProbeData.model));
          }
          const forgedProbeCases = [
            ['/api/models/local/activate', { modelId: 'zero-canvas-img2img', probeResponse: 'FORGED_SUCCESS' }, 'BROWSER TEST ERFORDERLICH'],
            ['/api/models/webgpu/activate', { modelId: 'webgpu-llama-3.2-1b', probeResponse: 'FORGED_SUCCESS' }, 'BROWSER TEST ERFORDERLICH'],
            ['/api/models/native/activate', { probeResponse: 'FORGED_SUCCESS' }, 'INSTALLATION ERFORDERLICH']
          ];
          for (const [path, payload, expectedStatus] of forgedProbeCases) {
            const response = await authFetch(path, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            if (response.status !== 202) {
              throw new Error('Untrusted browser probe was not safely downgraded: ' + path + ' (' + response.status + ') ' + await response.text());
            }
            const result = await response.json();
            if (result.verified !== false || result.model?.enabled !== true ||
                result.model?.testPassed !== false || result.model?.hasRealAdapter !== false ||
                result.model?.status !== expectedStatus) {
              throw new Error('Client-reported local availability must not be mistaken for trusted verification: ' + path + ' ' + JSON.stringify(result));
            }
            const disabledResponse = await authFetch('/api/models/' + result.model.id + '/toggle', { method: 'POST' });
            const disabledPayload = await disabledResponse.json();
            const disabledModel = disabledPayload.model;
            if (!disabledResponse.ok || disabledModel?.enabled !== false ||
                disabledModel?.testPassed !== false || disabledModel?.hasRealAdapter !== false ||
                disabledModel?.status !== expectedStatus) {
              throw new Error('Local availability toggle changed trusted verification state: ' + path + ' ' + JSON.stringify({ status: disabledResponse.status, error: disabledPayload.error, disabledModel, expectedStatus }));
            }
            const enabledResponse = await authFetch('/api/models/' + result.model.id + '/toggle', { method: 'POST' });
            const enabledModel = (await enabledResponse.json()).model;
            if (!enabledResponse.ok || enabledModel?.enabled !== true ||
                enabledModel?.testPassed !== false || enabledModel?.hasRealAdapter !== false ||
                enabledModel?.status !== expectedStatus) {
              throw new Error('Local availability could not be re-enabled without false verification: ' + path);
            }
          }
          const fluxImageModel = models.find((entry) => entry.id === 'flux-1-schnell-free');
          if (!fluxImageModel || fluxImageModel.enabled || !fluxImageModel.hasRealAdapter ||
              fluxImageModel.testPassed || fluxImageModel.freeTierType !== 'EINGESCHRÄNKT KOSTENLOS (FREE TIER)') {
            throw new Error('Cloudflare FLUX must have a real adapter but stay disabled until a real live test succeeds.');
          }
          const fluxToggle = await authFetch('/api/models/flux-1-schnell-free/toggle', { method: 'POST' });
          if (fluxToggle.status !== 409) throw new Error('Untested Cloudflare FLUX must not be activated.');
          const whisperModel = models.find((entry) => entry.id === 'cloudflare-whisper-large-v3-turbo');
          if (!whisperModel || whisperModel.enabled || !whisperModel.hasRealAdapter ||
              whisperModel.testPassed || whisperModel.freeTierType !== 'EINGESCHRÄNKT KOSTENLOS (FREE TIER)') {
            throw new Error('Cloudflare Whisper must have a real adapter but stay disabled until a live test succeeds.');
          }
          const whisperToggle = await authFetch('/api/models/cloudflare-whisper-large-v3-turbo/toggle', { method: 'POST' });
          if (whisperToggle.status !== 409) throw new Error('Untested Cloudflare Whisper must not be activated.');
          const moondreamModel = models.find((entry) => entry.id === 'cloudflare-moondream-3.1-9b-a2b');
          if (!moondreamModel || moondreamModel.enabled || !moondreamModel.hasRealAdapter ||
              moondreamModel.testPassed || moondreamModel.freeTierType !== 'EINGESCHRÄNKT KOSTENLOS (FREE TIER)') {
            throw new Error('Cloudflare Moondream must have a real adapter but stay disabled until a live test succeeds.');
          }
          const moondreamToggle = await authFetch('/api/models/cloudflare-moondream-3.1-9b-a2b/toggle', { method: 'POST' });
          if (moondreamToggle.status !== 409) throw new Error('Untested Cloudflare Moondream must not be activated.');
          for (const id of ['gpt-oss-20b-free', 'sd-turbo-free', 'sana-free']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.enabled || model.hasRealAdapter || model.freeTierType !== 'DERZEIT NICHT VERFÜGBAR') {
              throw new Error('Unsafe/unverified model state: ' + id);
            }
            const toggle = await authFetch('/api/models/' + id + '/toggle', { method: 'POST' });
            if (![400, 409].includes(toggle.status)) throw new Error('Unavailable model can be toggled: ' + id);
          }
          for (const id of ['gemini-3.8-flash', 'gemini-3.1-flash-lite', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-3.8-flash-lite-tts', 'gemini-3.8-flash-tts', 'gemini-3.5-transcribe', 'gemini-embedding-2', 'gemini-web-grounding']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.status !== 'INSTALLATION ERFORDERLICH' || model.testPassed) {
              throw new Error('Gemini model falsely marked live without API credentials: ' + id);
            }
          }
          for (const id of ['qwen-2.5-3b-coreml', 'llama-3.2-1b-coreml', 'llama-3.2-3b-coreml', 'gemma-3-4b-it', 'deepseek-r1-distill-1.5b', 'piper-tts-de', 'whisper-cpp-small', 'kokoro-82m']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.enabled || model.hasRealAdapter || model.status !== 'INSTALLATION ERFORDERLICH') {
              throw new Error('iOS model incorrectly marked ready: ' + id);
            }
            const toggle = await authFetch('/api/models/' + id + '/toggle', { method: 'POST' });
            if (![400, 409].includes(toggle.status)) throw new Error('Uninstalled iOS model can be enabled: ' + id);
          }
          const groundingFeature = models.find((entry) => entry.id === 'gemini-web-grounding');
          const groundingMetadata = String(groundingFeature?.provider ?? '') + String(groundingFeature?.limitations ?? '');
          if (!groundingFeature || groundingFeature.enabled || groundingFeature.testPassed ||
              !groundingMetadata.includes('gemini-2.5-flash-lite')) {
            throw new Error('Web grounding must remain disabled until a live free-tier test passes: ' + JSON.stringify(groundingFeature));
          }
          const serverSource = await (await import('node:fs/promises')).readFile('server.ts', 'utf8');
          if (!serverSource.includes("model: 'gemini-2.5-flash-lite'") || serverSource.includes("model: 'gemini-3.8-flash',\n        contents: `Recherchiere sachlich")) {
            throw new Error('Search requests are not isolated on the free-tier model');
          }
          const iosRuntime = await authFetch('/api/models/ios-runtime');
          const iosStatus = await iosRuntime.json();
          if (iosStatus.readyForDeployment !== false) throw new Error('iOS runtime claims readiness without model weights');
          const image = await authFetch('/api/image/generate', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: 'smoke test' })
          });
          if (image.status !== 503) throw new Error('Image route did not fail closed');
          const brain = await authFetch('/api/brain/chat', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ message: 'smoke test', modelId: 'gpt-oss-20b-free' })
          });
          if (brain.status !== 503) throw new Error('Unverified GPT-OSS route did not fail closed');

          // Safe HTTP end-to-end coverage for every remaining studio surface.
          // CI has no provider credentials or GPU worker; each provider-backed
          // route must fail closed without attempting a paid or external fallback.
          const [audioTts, audioPiper, audioTranscription, musicComposition, filmDraft] = await Promise.all([
            authFetch('/api/audio/tts', {
              method: 'POST', body: JSON.stringify({ text: 'ZERO audio workflow smoke test' })
            }),
            authFetch('/api/audio/tts/piper', {
              method: 'POST', headers: { 'Idempotency-Key': 'ci-piper-no-worker-smoke' },
              body: JSON.stringify({ text: 'ZERO Piper workflow smoke test' })
            }),
            authFetch('/api/audio/transcribe', {
              method: 'POST', body: JSON.stringify({ audioDataUrl: 'data:audio/wav;base64,AAAA' })
            }),
            authFetch('/api/music/compose', {
              method: 'POST', body: JSON.stringify({ prompt: 'ZERO music workflow smoke test', durationSec: 10 })
            }),
            authFetch('/api/film/direct', {
              method: 'POST', body: JSON.stringify({ idea: 'A safe CI-only film director smoke test', targetDurationSec: 20 })
            })
          ]);
          for (const [name, response, expected] of [
            ['Gemini TTS', audioTts, 503],
            ['Piper TTS', audioPiper, 503],
            ['Audio transcription', audioTranscription, 503],
            ['Music composition', musicComposition, 503],
            ['Film Director', filmDraft, 400]
          ]) {
            if (response.status !== expected) {
              throw new Error(name + ' did not fail closed without provider credentials: HTTP ' + response.status + ' ' + await response.text());
            }
          }

          const videoEngineStatusResponse = await authFetch('/api/video/engine/status');
          const videoEngineStatus = await videoEngineStatusResponse.json();
          if (!videoEngineStatusResponse.ok || videoEngineStatus.online !== false ||
              videoEngineStatus.costFallback !== false) {
            throw new Error('Video Studio must remain offline without an explicitly approved self-hosted GPU worker: ' + JSON.stringify(videoEngineStatus));
          }
          const videoJobWithoutWorker = await authFetch('/api/video/engine/jobs', {
            method: 'POST',
            headers: { 'Idempotency-Key': 'ci-no-worker-smoke' },
            body: JSON.stringify({ prompt: 'CI-only video worker gate', projectId: 'ci-project', sceneId: 'ci-scene' })
          });
          if (videoJobWithoutWorker.status !== 503) {
            throw new Error('Video Studio attempted to submit a job without an approved worker: HTTP ' + videoJobWithoutWorker.status);
          }

          const memoryFixtureTitle = 'ZERO E2E memory fixture';
          const memoryCreate = await authFetch('/api/memory', {
            method: 'POST',
            body: JSON.stringify({
              title: memoryFixtureTitle,
              content: 'zero-e2e-memory-token durable memory create search delete',
              type: 'knowledge',
              tags: ['ci', 'e2e']
            })
          });
          if (!memoryCreate.ok) throw new Error('Memory Studio could not persist a memory: ' + memoryCreate.status + ' ' + await memoryCreate.text());
          const createdMemory = (await memoryCreate.json()).memory;
          if (!createdMemory?.id || createdMemory.title !== memoryFixtureTitle) {
            throw new Error('Memory Studio returned an invalid persisted memory record');
          }
          const memoryRead = await authFetch('/api/memory');
          const memoryReadPayload = await memoryRead.json();
          if (!memoryRead.ok || !memoryReadPayload.memories?.some((entry) => entry.id === createdMemory.id)) {
            throw new Error('Memory Studio could not read back its persisted memory');
          }
          const memorySearch = await authFetch('/api/memory/search', {
            method: 'POST', body: JSON.stringify({ query: 'zero-e2e-memory-token' })
          });
          const memorySearchPayload = await memorySearch.json();
          if (!memorySearch.ok || !memorySearchPayload.results?.some((entry) => entry.memory?.id === createdMemory.id)) {
            throw new Error('Memory Studio lexical fallback search did not find the newly saved record');
          }
          const memoryDelete = await authFetch('/api/memory/' + createdMemory.id, { method: 'DELETE' });
          if (!memoryDelete.ok) throw new Error('Memory Studio could not delete its test record');
          const memoryAfterDelete = await authFetch('/api/memory');
          if ((await memoryAfterDelete.json()).memories?.some((entry) => entry.id === createdMemory.id)) {
            throw new Error('Memory Studio delete did not persist');
          }

          const automationBefore = await authFetch('/api/automation');
          const automationBeforePayload = await automationBefore.json();
          if (!automationBefore.ok || !Array.isArray(automationBeforePayload.runs)) {
            throw new Error('Automation Studio could not load its run history');
          }
          const blockedAutomation = await authFetch('/api/automation/run', {
            method: 'POST',
            body: JSON.stringify({ goal: 'CI-only plan must not invoke an unapproved AI provider', includeExternalPublishGate: true })
          });
          if (blockedAutomation.status !== 400) {
            throw new Error('Automation Studio did not block planning without an approved free model: HTTP ' + blockedAutomation.status);
          }
          const automationAfter = await authFetch('/api/automation');
          const automationAfterPayload = await automationAfter.json();
          if (!automationAfter.ok || automationAfterPayload.runs.length !== automationBeforePayload.runs.length) {
            throw new Error('Blocked automation planning must not persist a partial or falsely completed run');
          }
          const unknownAutomationConfirmation = await authFetch('/api/automation/ci-missing-run/confirm', { method: 'POST' });
          if (unknownAutomationConfirmation.status !== 404) {
            throw new Error('Automation confirmation accepted an unknown run');
          }
          console.log('Verified safe HTTP E2E for Image, Video, Film Director, Audio, Music, Projects, Model Hub, Memory and Automation; unavailable providers and GPU workers fail closed without paid fallbacks.');

          const jsonBackupResponse = await authFetch('/api/system/backup', {
            method: 'POST', body: JSON.stringify({ note: 'CI PostgreSQL backup integration test' })
          });
          if (!jsonBackupResponse.ok) throw new Error('PostgreSQL JSON backup failed: ' + await jsonBackupResponse.text());
          const { backup: jsonBackup } = await jsonBackupResponse.json();
          if (!jsonBackup.id) throw new Error('JSON backup metadata missing');
          const zipBackupResponse = await authFetch('/api/system/zip-backups', {
            method: 'POST', body: JSON.stringify({ changelog: 'CI PostgreSQL ZIP backup integration test' })
          });
          if (!zipBackupResponse.ok) throw new Error('PostgreSQL ZIP backup failed: ' + await zipBackupResponse.text());
          const { backup: zipBackup } = await zipBackupResponse.json();
          const zipDownload = await authFetch('/api/system/zip-backups/' + zipBackup.id + '/download');
          if (!zipDownload.ok) throw new Error('PostgreSQL ZIP download failed');
          const zipBytes = Buffer.from(await zipDownload.arrayBuffer());
          if (zipBytes.length !== zipBackup.sizeBytes || zipBytes[0] !== 0x50 || zipBytes[1] !== 0x4b) {
            throw new Error('PostgreSQL ZIP backup bytes are missing or corrupted');
          }
          const zipRestore = await authFetch('/api/system/zip-backups/' + zipBackup.id + '/restore', {
            method: 'POST', body: JSON.stringify({})
          });
          if (!zipRestore.ok) throw new Error('PostgreSQL ZIP restore failed: ' + await zipRestore.text());
          const mediaAfterZipRestore = await fetch(baseB + sceneVideoPath, { headers: { cookie } });
          const mediaBytesAfterZipRestore = Buffer.from(await mediaAfterZipRestore.arrayBuffer());
          if (!mediaAfterZipRestore.ok || !mediaBytesAfterZipRestore.equals(mp4Bytes)) {
            throw new Error('ZIP restore did not preserve the durable project scene clip');
          }
          const jsonRestore = await authFetch('/api/system/restore', {
            method: 'POST', body: JSON.stringify({ backupId: jsonBackup.id })
          });
          if (!jsonRestore.ok) throw new Error('PostgreSQL JSON restore failed: ' + await jsonRestore.text());
          const mediaAfterJsonRestore = await fetch(baseB + sceneVideoPath, { headers: { cookie } });
          const mediaBytesAfterJsonRestore = Buffer.from(await mediaAfterJsonRestore.arrayBuffer());
          if (!mediaAfterJsonRestore.ok || !mediaBytesAfterJsonRestore.equals(mp4Bytes)) {
            throw new Error('JSON backup restore did not preserve the durable project scene clip');
          }
          const reconciliationResponse = await authFetch('/api/system/zip-backups/reconciliation');
          if (!reconciliationResponse.ok) throw new Error('PostgreSQL backup reconciliation endpoint failed: ' + await reconciliationResponse.text());
          const reconciliation = await reconciliationResponse.json();
          if (reconciliation.orphanedCount !== 0 || reconciliation.missingCount !== 0 ||
              !Array.isArray(reconciliation.orphanedBlobIds) || !Array.isArray(reconciliation.missingBlobIds)) {
            throw new Error('PostgreSQL backup reconciliation found inconsistent metadata/blob state: ' + JSON.stringify(reconciliation));
          }
          const projectDeleteIdempotencyKey = 'ci-project-delete-' + durationProject.id;
          const projectDeleteOptions = { method: 'DELETE', headers: { 'Idempotency-Key': projectDeleteIdempotencyKey } };
          const deleteProjectResponse = await authFetch('/api/projects/' + durationProject.id, projectDeleteOptions);
          if (!deleteProjectResponse.ok) throw new Error('Project deletion did not complete its durable clip cleanup: ' + deleteProjectResponse.status + ' ' + await deleteProjectResponse.text());
          const retryProjectDelete = await authFetch('/api/projects/' + durationProject.id, projectDeleteOptions);
          if (!retryProjectDelete.ok) throw new Error('Idempotent project deletion retry failed: ' + retryProjectDelete.status + ' ' + await retryProjectDelete.text());
          const deletedProjectClip = await fetch(baseB + sceneVideoPath, { headers: { cookie } });
          if (deletedProjectClip.status !== 404) throw new Error('Project deletion left a scene clip readable');
          const deletedProjectHistory = await fetch(baseB + '/api/projects/' + durationProject.id + '/videos', { headers: { cookie } });
          if (deletedProjectHistory.status !== 404) throw new Error('Project deletion left clip history accessible');
          console.log('Verified PostgreSQL state, JSON backups, ZIP backup download/restore and read-only reconciliation.');

          // Controlled read-only burst across both production-mode processes.
          // This is an isolated CI capacity smoke test, not a live-production stress test.
          const burstPaths = ['/api/projects', '/api/models', '/api/auth/status'];
          const burstStartedAt = performance.now();
          const burstLatencies = await Promise.all(Array.from({ length: 32 }, async (_, index) => {
            const target = index % 2 === 0 ? base : baseB;
            const path = burstPaths[index % burstPaths.length];
            const requestStartedAt = performance.now();
            const response = await fetch(target + path, {
              headers: { cookie },
              signal: AbortSignal.timeout(12000)
            });
            const latencyMs = performance.now() - requestStartedAt;
            if (!response.ok) {
              throw new Error('Concurrent read burst failed: ' + path + ' returned ' + response.status + ' ' + await response.text());
            }
            const payload = await response.json();
            if (path === '/api/projects' && !Array.isArray(payload.projects)) {
              throw new Error('Concurrent project read returned an invalid payload');
            }
            if (path === '/api/models' && !Array.isArray(payload.models)) {
              throw new Error('Concurrent model catalog read returned an invalid payload');
            }
            if (path === '/api/auth/status' && !payload.authenticated) {
              throw new Error('Concurrent authenticated status read lost its session');
            }
            return latencyMs;
          }));
          const sortedBurstLatencies = [...burstLatencies].sort((a, b) => a - b);
          const burstP95Ms = sortedBurstLatencies[Math.ceil(sortedBurstLatencies.length * 0.95) - 1];
          const burstMaxMs = sortedBurstLatencies.at(-1);
          const burstDurationMs = performance.now() - burstStartedAt;
          if (burstLatencies.length !== 32 || burstP95Ms > 12000) {
            throw new Error('Read burst exceeded the 12-second request budget: p95=' + burstP95Ms + 'ms');
          }
          console.log('Verified 32 concurrent authenticated read requests across two server instances: ' +
            'p95=' + Math.round(burstP95Ms) + 'ms, max=' + Math.round(burstMaxMs) +
            'ms, wall=' + Math.round(burstDurationMs) + 'ms.');

          const logout = await authFetch('/api/auth/logout', { method: 'POST' });
          if (!logout.ok) throw new Error('Logout failed');
          const clearedCookie = logout.headers.get('set-cookie') ?? '';
          if (!clearedCookie.includes('Max-Age=0')) throw new Error('Logout did not clear the session cookie');
          const afterLogout = await fetch(base + '/api/projects', { headers: { cookie } });
          if (afterLogout.status !== 401) throw new Error('Revoked session cookie remained valid after logout');
          console.log('Verified unavailable providers stay disabled; no paid fallback.');
          NODE


  arm64-container:
    name: ARM64 Node and Piper container smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up QEMU ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - name: Initialize Buildx
        run: |
          docker buildx create --name zero-arm64 --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and run ZERO Node.js 22 image for ARM64
        run: |
          mkdir -p searxng
          printf 'DATABASE_URL=ci-secret-must-not-enter-image\\n' > production.env
          printf 'ZERO_TTS_WORKER_TOKEN=ci-worker-secret-must-not-enter-image\\n' > .env.workers
          printf 'SEARXNG_SECRET=ci-search-secret-must-not-enter-image\\n' > searxng/searxng.env
          docker buildx build --platform linux/arm64 --load --tag zero-arm64:ci .
          test "$(docker run --rm --platform linux/arm64 zero-arm64:ci node -p 'process.arch')" = "arm64"
          docker run --rm --platform linux/arm64 --entrypoint node zero-arm64:ci -e "const fs=require('node:fs'); for (const p of ['production.env','.env.workers','searxng/searxng.env']) if(fs.existsSync('/app/'+p)) throw new Error('Secret file leaked into image: '+p); console.log('Production and worker secret files are absent from the runtime image.')"
          if docker run --rm --platform linux/arm64 \
            --env NODE_ENV=production \
            --env ZERO_ADMIN_PASSWORD=zero-ci-password-123 \
            --env ZERO_SESSION_SECRET=zero-ci-session-secret-012345678901234567890123456789 \
            zero-arm64:ci >/tmp/zero-production-gate.log 2>&1; then
            cat /tmp/zero-production-gate.log
            echo "Production startup unexpectedly accepted a missing DATABASE_URL."
            exit 1
          fi
          grep -F "DATABASE_URL fehlt" /tmp/zero-production-gate.log
          echo "ARM64 runtime image correctly refuses production startup without DATABASE_URL."
      - name: Build Piper ARM64 image and verify ONNX CPU provider
        run: |
          docker buildx build --platform linux/arm64 --load --tag zero-piper-arm64:ci ./piper-worker
          docker run --rm --platform linux/arm64 zero-piper-arm64:ci python -c "import platform, onnxruntime as ort; from piper import PiperVoice; assert platform.machine() in ('aarch64', 'arm64'); assert 'CPUExecutionProvider' in ort.get_available_providers(); print(platform.machine(), ort.get_available_providers())"
          PIPER_CI_TOKEN=$(openssl rand -hex 32)
          docker run --rm --platform linux/arm64 --env ZERO_TTS_WORKER_TOKEN="$PIPER_CI_TOKEN" zero-piper-arm64:ci python -c "from fastapi.testclient import TestClient; from app import app; c=TestClient(app); r=c.get('/health'); assert r.status_code == 200 and r.json()['ok'] and r.json()['auth_configured'] and 'CPUExecutionProvider' in r.json()['execution_providers']; assert c.post('/tts', json={'text':'no inference'}, headers={'Authorization':'Bearer wrong-token'}).status_code == 401; print('Piper health and auth rejection passed:', r.json())"
          docker run --rm --platform linux/arm64 zero-piper-arm64:ci python -c "from fastapi.testclient import TestClient; from app import app; r=TestClient(app).get('/health'); assert r.status_code == 503; print('Piper correctly fails health without a secure worker token.')"
          docker run --rm --platform linux/arm64 --volume "$PWD/piper-worker/test_model_cache.py:/app/test_model_cache.py:ro" zero-piper-arm64:ci python -m unittest -v test_model_cache

  deployment-config:
    name: Validate production Compose and Caddy configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare disposable CI-only environment files
        run: |
          cp production.env.example production.env
          cp workers.env.example .env.workers
          cp searxng/searxng.env.example searxng/searxng.env
      - name: Validate production Compose configuration
        run: docker compose --file docker-compose.workers.yml config --quiet
      - name: Assert production network and persistent-volume boundaries
        run: |
          docker compose --file docker-compose.workers.yml --profile gpu config --format json > /tmp/zero-compose.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('/tmp/zero-compose.json', 'utf8'));
          const services = config.services ?? {};
          const app = services['zero-app'];
          const piper = services['zero-worker'];
          const wan = services['wan-worker'];
          if (!app || app.ports?.length !== 1 || app.ports[0].host_ip !== '127.0.0.1' || String(app.ports[0].target) !== '3000') {
            throw new Error('ZERO must publish only host-loopback port 3000');
          }
          if (!piper || (piper.ports ?? []).length !== 0 || piper.read_only !== true ||
              !(piper.volumes ?? []).some(v => v.target === '/var/lib/zero-piper' && v.type === 'volume')) {
            throw new Error('Piper must remain private, read-only, and backed by the named voice volume');
          }
          if ((services.searxng?.ports ?? []).length !== 0) {
            throw new Error('SearXNG must not publish a host port');
          }
          if (!wan || !(wan.profiles ?? []).includes('gpu')) {
            throw new Error('Wan GPU worker must remain opt-in behind the gpu profile');
          }
          console.log('Compose network exposure, Piper named-volume and optional GPU profile assertions passed.');
          NODE
      - name: Validate Caddyfile with an explicit test hostname
        env:
          ZERO_DOMAIN: zero-ci.example.invalid
        run: |
          docker run --rm --env ZERO_DOMAIN="$ZERO_DOMAIN" \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Enforce canonical Caddyfile formatting
        run: |
          docker run --rm --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile" \
            caddy:2-alpine caddy fmt --overwrite /etc/caddy/Caddyfile
          git diff --exit-code -- deploy/Caddyfile
      - name: Ensure Caddy rejects an unset production hostname
        run: |
          if docker run --rm --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/tmp/caddy-no-domain.log 2>&1; then
            cat /tmp/caddy-no-domain.log
            echo "Caddy unexpectedly accepted an unset ZERO_DOMAIN."
            exit 1
          fi
          echo "Caddy correctly rejects an unset ZERO_DOMAIN."
      - name: Smoke-test private production Compose startup without inference
        timeout-minutes: 8
        run: |
          set -euo pipefail
          WORKER_TOKEN=$(openssl rand -hex 32)
          SEARCH_SECRET=$(openssl rand -hex 32)
          VIDEO_TOKEN=$(openssl rand -hex 32)
          cat > production.env <<EOF
          NODE_ENV=production
          ZERO_ADMIN_PASSWORD=zero-ci-password-123
          ZERO_SESSION_SECRET=zero-ci-session-secret-012345678901234567890123456789
          ZERO_TTS_WORKER_TOKEN=$WORKER_TOKEN
          ZERO_GEMINI_FREE_TIER_ONLY=false
          EOF
          cat > .env.workers <<EOF
          ZERO_TTS_WORKER_TOKEN=$WORKER_TOKEN
          WAN_MODEL_ID=Wan-AI/Wan2.1-T2V-1.3B-Diffusers
          ZERO_VIDEO_ENGINE_TOKEN=$VIDEO_TOKEN
          EOF
          cat > searxng/searxng.env <<EOF
          SEARXNG_SECRET=$SEARCH_SECRET
          EOF
          cat > /tmp/zero-ci-db.override.yml <<'EOF'
          services:
            zero-app:
              depends_on:
                zero-db:
                  condition: service_healthy
              environment:
                DATABASE_URL: postgresql://zero:zero-ci-password@zero-db:5432/zero_ci
            zero-db:
              image: postgres:16.16
              environment:
                POSTGRES_DB: zero_ci
                POSTGRES_USER: zero
                POSTGRES_PASSWORD: zero-ci-password
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U zero -d zero_ci"]
                interval: 2s
                timeout: 2s
                retries: 45
              volumes:
                - zero-ci-postgres-data:/var/lib/postgresql/data
          volumes:
            zero-ci-postgres-data:
          EOF
          compose() {
            docker compose --file docker-compose.workers.yml --file /tmp/zero-ci-db.override.yml "$@"
          }
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              compose logs --no-color zero-app zero-db || true
            fi
            compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          compose up --detach --build zero-app
          for attempt in $(seq 1 90); do
            APP_ID=$(compose ps --quiet zero-app)
            PIPER_ID=$(compose ps --quiet zero-worker)
            SEARCH_ID=$(compose ps --quiet searxng)
            if [ -n "$APP_ID" ] && [ -n "$PIPER_ID" ] && [ -n "$SEARCH_ID" ]; then
              APP_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' "$APP_ID")
              PIPER_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' "$PIPER_ID")
              SEARCH_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' "$SEARCH_ID")
              if [ "$APP_HEALTH" = healthy ] && [ "$PIPER_HEALTH" = healthy ] && [ "$SEARCH_HEALTH" = healthy ]; then
                break
              fi
            fi
            sleep 4
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$APP_ID")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$PIPER_ID")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$SEARCH_ID")" = healthy
          compose exec --no-TTY zero-app node --input-type=module -e "const base='http://zero-worker:8000'; const h=await fetch(base+'/health'); const p=await h.json(); if(!h.ok||!p.auth_configured||p.voice_loaded) throw new Error('Piper health or lazy-load state incorrect'); const denied=await fetch(base+'/tts',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer invalid-ci-token'},body:JSON.stringify({text:'must not synthesize'})}); if(denied.status!==401) throw new Error('Piper did not reject an invalid token before inference'); console.log('Private Piper DNS, authenticated health and no-inference rejection passed.');"
          compose exec --no-TTY zero-worker python -c "from pathlib import Path; p=Path('/var/lib/zero-piper/ci-volume-persistence-probe'); p.write_text('survives-worker-restart')"
          compose restart zero-worker
          PIPER_HEALTH=""
          for attempt in $(seq 1 45); do
            PIPER_ID=$(compose ps --all --quiet zero-worker | head -n 1)
            if [ -n "$PIPER_ID" ]; then
              PIPER_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' "$PIPER_ID" 2>/dev/null || true)
            fi
            if [ "$PIPER_HEALTH" = healthy ]; then break; fi
            sleep 2
          done
          if [ "$PIPER_HEALTH" != healthy ]; then
            compose logs --no-color zero-worker
            exit 1
          fi
          compose exec --no-TTY zero-worker python -c "from pathlib import Path; p=Path('/var/lib/zero-piper/ci-volume-persistence-probe'); assert p.read_text() == 'survives-worker-restart'; print('Piper named volume survives a worker container restart.')"
          LIVE_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/live)
          echo "Compose /api/live HTTP status: $LIVE_STATUS"
          test "$LIVE_STATUS" = 200
          READY_STATUS=$(curl --silent --show-error --output /tmp/zero-readiness.json --write-out '%{http_code}' http://127.0.0.1:3000/api/health)
          echo "Compose /api/health HTTP status: $READY_STATUS; body: $(cat /tmp/zero-readiness.json)"
          test "$READY_STATUS" = 200
          echo "Compose app and PostgreSQL are healthy; Piper remains authenticated and no inference was invoked."