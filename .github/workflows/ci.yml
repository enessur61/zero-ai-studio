name: ZERO AI STUDIO CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This workflow validates the current commit. Obsolete runs may be cancelled;
# the full native iOS build is handled by its own workflow.
concurrency:
  # Give each commit an independent run so an orphaned macOS job cannot block newer PR validation.
  group: zero-ai-studio-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
        env:
          POSTGRES_USER: zero
          POSTGRES_PASSWORD: zero-test-password
          POSTGRES_DB: zero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zero -d zero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Block committed local data and credential files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n');
          const forbidden = files.filter((file) =>
            file === '.env' ||
            (file.startsWith('.env.') && file !== '.env.example') ||
            file.endsWith('/zero-studio-db.json') ||
            file === 'zero-studio-db.json' ||
            ['.pem', '.key', '.p12', '.pfx', '.sqlite', '.db'].some((ext) => file.toLowerCase().endsWith(ext))
          );
          if (forbidden.length) {
            console.error('Forbidden local data or secret files are tracked:', forbidden);
            process.exit(1);
          }
          for (const archive of files.filter((file) => file.toLowerCase().endsWith('.zip'))) {
            const entries = execFileSync('unzip', ['-Z1', archive], { encoding: 'utf8' }).split(String.fromCharCode(10));
            const unsafeArchiveEntries = entries.filter((file) => {
              const parts = file.replaceAll(String.fromCharCode(92), '/').split('/');
              const name = parts.at(-1) ?? '';
              return name === '.env' ||
                (name.startsWith('.env.') && name !== '.env.example') ||
                name === 'zero-studio-db.json' ||
                parts[0] === 'data' ||
                ['.pem', '.key', '.p12', '.pfx', '.sqlite', '.db'].some((ext) => name.toLowerCase().endsWith(ext));
            });
            if (unsafeArchiveEntries.length) {
              console.error('Archive contains local data or secrets:', archive, unsafeArchiveEntries);
              process.exit(1);
            }
          }
          console.log('No prohibited local database or credential files are tracked.');
          NODE
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.24.2'
      - name: Scan repository content and git history for leaked secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.2 git --redact --no-banner .
      - run: npm ci --no-audit --no-fund
      - name: Verify Gemini calls are blocked unless free-only billing is confirmed
        shell: bash
        run: |
          GEMINI_API_KEY=ci-dummy-key ZERO_GEMINI_FREE_TIER_ONLY=false node --import tsx --input-type=module <<'NODE'
          import { getGeminiClient } from './server/geminiClient.ts';
          let blocked = false;
          try {
            getGeminiClient();
          } catch (error) {
            blocked = String(error).includes('ZERO_GEMINI_FREE_TIER_ONLY=true');
          }
          if (!blocked) throw new Error('Gemini API was not blocked without explicit free-only billing confirmation');
          console.log('Gemini API correctly blocked until billing-disabled confirmation.');
          NODE
      - run: npm run lint
      - run: npm test
      - name: Test persistent GPU worker job storage
        run: python3 gpu-worker/test_job_store.py
      - name: Run PostgreSQL revision and concurrency integration tests
        env:
          DATABASE_URL: postgres://zero:zero-test-password@localhost:5432/zero_test
          ZERO_POSTGRES_TESTS: 'true'
        run: npx tsx tests/postgresRevisionConcurrency.integration.test.ts
      - run: npm run build
      - name: Production server smoke test
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ENV=(NODE_ENV=production DATABASE_URL=postgres://zero:zero-test-password@localhost:5432/zero_test GEMINI_API_KEY=ci-dummy-key ZERO_GEMINI_FREE_TIER_ONLY=false ZERO_ADMIN_PASSWORD=zero-ci-password-123 ZERO_SESSION_SECRET=zero-ci-session-secret-012345678901234567890123456789)
          env "${COMMON_ENV[@]}" PORT=4179 npm start > /tmp/zero-server-a.log 2>&1 &
          SERVER_PID_A=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- ZERO SERVER A LOG ---"; cat /tmp/zero-server-a.log; echo "--- ZERO SERVER B LOG ---"; cat /tmp/zero-server-b.log; fi; kill "${SERVER_PID_A:-}" "${SERVER_PID_B:-}" 2>/dev/null || true; exit "$status"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4179/api/health > /tmp/zero-health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID_A" 2>/dev/null; then
              cat /tmp/zero-server-a.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/zero-health.json
          env "${COMMON_ENV[@]}" PORT=4180 npm start > /tmp/zero-server-b.log 2>&1 &
          SERVER_PID_B=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4180/api/health > /tmp/zero-health-b.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID_B" 2>/dev/null; then
              cat /tmp/zero-server-b.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/zero-health-b.json
          node -e "const h=require('/tmp/zero-health.json'); if(!h.ok || h.app !== 'ZERO AI STUDIO' || h.maxVideoDurationSec !== 60 || h.readiness?.database !== 'ready' || h.readiness?.authentication !== 'ready') process.exit(1); console.log(JSON.stringify(h))"
          for asset in /manifest.webmanifest /sw.js /icons/apple-touch-icon.png; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4179$asset"
          done
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:4179';
          const baseB = 'http://127.0.0.1:4180';
          const unauthenticated = await fetch(base + '/api/projects');
          if (unauthenticated.status !== 401) throw new Error('Private API is accessible without login');
          const authStatus = await fetch(base + '/api/auth/status');
          const authInfo = await authStatus.json();
          if (!authInfo.required || !authInfo.configured || authInfo.authenticated) throw new Error('Production auth status is incorrect');
          const badLogin = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (badLogin.status !== 401) throw new Error('Invalid password was not rejected');
          const login = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'zero-ci-password-123' })
          });
          if (!login.ok) throw new Error('Production login failed');
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          if (!cookie) throw new Error('Login did not set a session cookie');
          const authFetch = (path, options = {}) => fetch(base + path, {
            ...options,
            headers: { 'content-type': 'application/json', ...(options.headers ?? {}), cookie }
          });
          const authenticatedStatus = await authFetch('/api/auth/status');
          const authenticatedInfo = await authenticatedStatus.json();
          if (!authenticatedInfo.authenticated) throw new Error('Session cookie rejected: ' + JSON.stringify(authenticatedInfo));
          const crossInstanceLogin = await fetch(base + '/api/auth/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: 'zero-ci-password-123' })
          });
          const crossInstanceCookie = crossInstanceLogin.headers.get('set-cookie')?.split(';')[0];
          if (!crossInstanceLogin.ok || !crossInstanceCookie) throw new Error('Second production login failed');
          const crossInstanceAccess = await fetch(baseB + '/api/projects', { headers: { cookie: crossInstanceCookie } });
          if (!crossInstanceAccess.ok) throw new Error('A session created on instance A was not accepted by instance B');
          const crossInstanceLogout = await fetch(baseB + '/api/auth/logout', {
            method: 'POST', headers: { cookie: crossInstanceCookie }
          });
          if (!crossInstanceLogout.ok) throw new Error('Logout on instance B failed');
          const revokedOnA = await fetch(base + '/api/projects', { headers: { cookie: crossInstanceCookie } });
          if (revokedOnA.status !== 401) throw new Error('Logout on instance B did not revoke the session on instance A');
          const securityHeaders = await fetch(base + '/api/health');
          for (const header of ['x-content-type-options', 'referrer-policy', 'x-frame-options', 'permissions-policy', 'content-security-policy-report-only', 'strict-transport-security']) {
            if (!securityHeaders.headers.get(header)) throw new Error('Missing security header: ' + header);
          }
          if (securityHeaders.headers.has('x-powered-by')) throw new Error('Express X-Powered-By header must be disabled');
          const unknownApi = await authFetch('/api/this-route-does-not-exist');
          if (unknownApi.status !== 404 ||
              !(unknownApi.headers.get('content-type') ?? '').includes('application/json') ||
              !(await unknownApi.json()).error) {
            throw new Error('Unknown API routes must return JSON 404, not the SPA fallback');
          }
          for (let attempt = 0; attempt < 8; attempt++) {
            const rateBase = attempt % 2 === 0 ? base : baseB;
            const limited = await fetch(rateBase + '/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.10' },
              body: JSON.stringify({ password: 'incorrect-ci-password' })
            });
            if (limited.status !== 401) throw new Error('Shared login rate limit triggered too early across production instances');
          }
          const blockedIp = await fetch(baseB + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.10' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (blockedIp.status !== 429) throw new Error('Shared login rate limit did not block the ninth attempt on the other instance');
          const independentIp = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-forwarded-for': '203.0.113.11' },
            body: JSON.stringify({ password: 'incorrect-ci-password' })
          });
          if (independentIp.status !== 401) throw new Error('Login rate limit is shared across different forwarded client IPs');
          const durationResponse = await authFetch('/api/projects', {
            method: 'POST',
            body: JSON.stringify({
              title: 'CI 60-second cap test',
              scenes: Array.from({ length: 16 }, (_, index) => ({ id: 'scene-' + index, durationSec: 5, imageUrl: 'javascript:alert(1)', audioDataUrl: 'data:text/html;base64,PHNjcmlwdD4=' }))
            })
          });
          if (!durationResponse.ok) throw new Error('Project duration cap endpoint failed: ' + durationResponse.status + ' ' + await durationResponse.text());
          const { project: durationProject } = await durationResponse.json();
          const totalDuration = durationProject.scenes.reduce((sum, scene) => sum + scene.durationSec, 0);
          if (totalDuration > 60) throw new Error('Film duration exceeded hard 60-second cap: ' + totalDuration);
          if (durationProject.scenes.some((scene) => scene.imageUrl !== undefined || scene.audioDataUrl !== undefined) ||
              durationProject.snapshots[0].state.scenes.some((scene) => scene.imageUrl !== undefined || scene.audioDataUrl !== undefined)) {
            throw new Error('Project creation persisted unsafe scene media URLs');
          }
          if (durationProject.targetDurationSec !== totalDuration ||
              durationProject.snapshots[0].sceneCount !== durationProject.scenes.length ||
              durationProject.snapshots[0].totalDurationSec !== totalDuration) {
            throw new Error('Project duration metadata does not match its clamped timeline');
          }
          const mediaDataUrl = 'data:video/mp4;base64,' + Buffer.alloc(2048, 0).toString('base64');
          const sceneVideoPath = '/api/projects/' + durationProject.id + '/scenes/' + durationProject.scenes[0].id + '/video';
          const mediaWrite = await authFetch(sceneVideoPath, {
            method: 'PUT', body: JSON.stringify({ dataUrl: mediaDataUrl })
          });
          if (!mediaWrite.ok || !(await mediaWrite.json()).serverPersisted) throw new Error('Scene clip was not persisted to the project');
          const mediaReadFromSecondInstance = await fetch(baseB + sceneVideoPath, { headers: { cookie } });
          const mediaPayload = await mediaReadFromSecondInstance.json();
          if (!mediaReadFromSecondInstance.ok || mediaPayload.dataUrl !== mediaDataUrl) {
            throw new Error('Scene media written on instance A was not visible on instance B');
          }
          const crossInstanceProjects = await fetch(baseB + '/api/projects', { headers: { cookie } });
          const crossInstanceProjectPayload = await crossInstanceProjects.json();
          const projectAfterMediaWrite = crossInstanceProjectPayload.projects?.find((project) =>
            project.id === durationProject.id
          );
          if (!crossInstanceProjects.ok ||
              !projectAfterMediaWrite?.assets?.some((asset) =>
                asset.modelId === 'zero-scene-video:' + durationProject.scenes[0].id
              )) {
            throw new Error('Project/asset reads on instance B returned stale PostgreSQL state');
          }
          if (!durationProject.snapshots[0].state ||
              durationProject.snapshots[0].state.scenes.length !== durationProject.scenes.length) {
            throw new Error('New projects must store a complete, restorable initial snapshot');
          }
          const editedProjectResponse = await authFetch('/api/projects/' + durationProject.id, {
            method: 'PUT',
            body: JSON.stringify({
              title: 'CI edited project',
              scenes: durationProject.scenes.slice(0, 1).map((scene) => ({ ...scene, imageUrl: 'javascript:alert(1)', audioDataUrl: 'data:text/html;base64,PHNjcmlwdD4=' })),
              snapshotNote: 'CI snapshot restore test',
              id: 'attacker-controlled-id',
              createdAt: '2000-01-01T00:00:00.000Z',
              updatedAt: '2000-01-01T00:00:00.000Z',
              version: 999999,
              targetDurationSec: 999999,
              snapshots: [],
              assets: [{ id: 'forged-asset', type: 'image', title: 'Injected', url: 'javascript:alert(1)', modelId: 'attacker', createdAt: '2000-01-01T00:00:00.000Z' }],
              status: 'HACKED'
            })
          });
          if (!editedProjectResponse.ok) throw new Error('Project edit for snapshot test failed');
          const editedProject = (await editedProjectResponse.json()).project;
          if (editedProject.id !== durationProject.id ||
              editedProject.createdAt !== durationProject.createdAt ||
              editedProject.version !== durationProject.version + 1 ||
              editedProject.targetDurationSec > 60 ||
              editedProject.status !== durationProject.status ||
              editedProject.assets.length !== projectAfterMediaWrite.assets.length ||
              editedProject.snapshots.length === 0 ||
              editedProject.updatedAt === '2000-01-01T00:00:00.000Z' ||
              editedProject.scenes[0]?.imageUrl !== undefined ||
              editedProject.scenes[0]?.audioDataUrl !== undefined) {
            throw new Error('Project update accepted client-controlled server fields or unsafe scene media URLs: ' + JSON.stringify({ editedId: editedProject.id, expectedId: durationProject.id, editedVersion: editedProject.version, expectedVersion: durationProject.version + 1, editedAssets: editedProject.assets?.length, expectedAssets: projectAfterMediaWrite.assets?.length, editedStatus: editedProject.status, expectedStatus: durationProject.status }));
          }
          const unsafeJavascriptAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'javascript:alert(1)' })
          });
          if (unsafeJavascriptAsset.status !== 400) throw new Error('javascript: project asset URL was not rejected');
          const unsafeHtmlAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'data:text/html;base64,PHNjcmlwdD4=' })
          });
          if (unsafeHtmlAsset.status !== 400) throw new Error('HTML data URL was not rejected as an image asset');
          const safeImageAsset = await authFetch('/api/projects/' + durationProject.id + '/assets', {
            method: 'POST', body: JSON.stringify({ type: 'image', url: 'data:image/png;base64,AAAA' })
          });
          if (!safeImageAsset.ok) throw new Error('Valid PNG data URL was rejected as a project asset');
          const snapshotToRestore = editedProject.snapshots.find((snapshot) => snapshot.state);
          if (!snapshotToRestore) throw new Error('Project edit did not create a restorable snapshot');
          const restoreResponse = await authFetch(
            '/api/projects/' + durationProject.id + '/snapshots/' + snapshotToRestore.id + '/restore',
            { method: 'POST' }
          );
          if (!restoreResponse.ok) throw new Error('Project snapshot restore endpoint failed: ' + await restoreResponse.text());
          const restoredProject = (await restoreResponse.json()).project;
          if (restoredProject.title !== durationProject.title ||
              restoredProject.scenes.length !== durationProject.scenes.length ||
              restoredProject.version <= editedProject.version ||
              !restoredProject.snapshots[0].state) {
            throw new Error('Project snapshot restore did not restore content and preserve a safety snapshot');
          }
          const removedLegacyModel = await authFetch('/api/models/gemini-3.7-flash/test', { method: 'POST' });
          if (removedLegacyModel.status !== 404) {
            throw new Error('Deprecated Gemini alias is still exposed by the API');
          }
          const billingGateResponse = await authFetch('/api/models/gemini-3.8-flash/test', { method: 'POST' });
          const billingGate = await billingGateResponse.json();
          if (!billingGateResponse.ok || billingGate.model?.status !== 'INSTALLATION ERFORDERLICH' ||
              !billingGate.model?.lastTestMessage?.includes('ZERO_GEMINI_FREE_TIER_ONLY=true')) {
            throw new Error('Gemini billing safety gate is not clearly enforced: ' + JSON.stringify(billingGate));
          }
          const modelResponse = await authFetch('/api/models');
          if (!modelResponse.ok) throw new Error('Model catalog endpoint failed: ' + modelResponse.status + ' ' + await modelResponse.text());
          const { models } = await modelResponse.json();
          const localProbe = await authFetch('/api/models/zero-canvas-img2img/test', { method: 'POST' });
          if (!localProbe.ok) throw new Error('Local browser adapter probe failed');
          const localProbeData = await localProbe.json();
          if (localProbeData.model.status !== 'BROWSER TEST ERFORDERLICH' || localProbeData.model.testPassed) {
            throw new Error('Server falsely marked a browser-only adapter as verified: ' + JSON.stringify(localProbeData.model));
          }
          const forgedProbeCases = [
            ['/api/models/local/activate', { modelId: 'zero-canvas-img2img', probeResponse: 'FORGED_SUCCESS' }, 'BROWSER TEST ERFORDERLICH'],
            ['/api/models/webgpu/activate', { modelId: 'webgpu-llama-3.2-1b', probeResponse: 'FORGED_SUCCESS' }, 'BROWSER TEST ERFORDERLICH'],
            ['/api/models/native/activate', { probeResponse: 'FORGED_SUCCESS' }, 'INSTALLATION ERFORDERLICH']
          ];
          for (const [path, payload, expectedStatus] of forgedProbeCases) {
            const response = await authFetch(path, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            if (response.status !== 202) {
              throw new Error('Untrusted browser probe was not safely downgraded: ' + path + ' (' + response.status + ') ' + await response.text());
            }
            const result = await response.json();
            if (result.verified !== false || result.model?.enabled !== true ||
                result.model?.testPassed !== false || result.model?.hasRealAdapter !== false ||
                result.model?.status !== expectedStatus) {
              throw new Error('Client-reported local availability must not be mistaken for trusted verification: ' + path + ' ' + JSON.stringify(result));
            }
            const disabledResponse = await authFetch('/api/models/' + result.model.id + '/toggle', { method: 'POST' });
            const disabledPayload = await disabledResponse.json();
            const disabledModel = disabledPayload.model;
            if (!disabledResponse.ok || disabledModel?.enabled !== false ||
                disabledModel?.testPassed !== false || disabledModel?.hasRealAdapter !== false ||
                disabledModel?.status !== expectedStatus) {
              throw new Error('Local availability toggle changed trusted verification state: ' + path + ' ' + JSON.stringify({ status: disabledResponse.status, error: disabledPayload.error, disabledModel, expectedStatus }));
            }
            const enabledResponse = await authFetch('/api/models/' + result.model.id + '/toggle', { method: 'POST' });
            const enabledModel = (await enabledResponse.json()).model;
            if (!enabledResponse.ok || enabledModel?.enabled !== true ||
                enabledModel?.testPassed !== false || enabledModel?.hasRealAdapter !== false ||
                enabledModel?.status !== expectedStatus) {
              throw new Error('Local availability could not be re-enabled without false verification: ' + path);
            }
          }
          for (const id of ['gpt-oss-20b-free', 'flux-1-schnell-free', 'sd-turbo-free', 'sana-free']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.enabled || model.hasRealAdapter || model.freeTierType !== 'DERZEIT NICHT VERFÜGBAR') {
              throw new Error('Unsafe/unverified model state: ' + id);
            }
            const toggle = await authFetch('/api/models/' + id + '/toggle', { method: 'POST' });
            if (![400, 409].includes(toggle.status)) throw new Error('Unavailable model can be toggled: ' + id);
          }
          for (const id of ['gemini-3.8-flash', 'gemini-3.1-flash-lite', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-3.8-flash-lite-tts', 'gemini-3.8-flash-tts', 'gemini-3.5-transcribe', 'gemini-embedding-2', 'gemini-web-grounding']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.status !== 'INSTALLATION ERFORDERLICH' || model.testPassed) {
              throw new Error('Gemini model falsely marked live without API credentials: ' + id);
            }
          }
          for (const id of ['qwen-2.5-3b-coreml', 'llama-3.2-1b-coreml', 'llama-3.2-3b-coreml', 'gemma-3-4b-it', 'deepseek-r1-distill-1.5b', 'piper-tts-de', 'whisper-cpp-small', 'kokoro-82m']) {
            const model = models.find((entry) => entry.id === id);
            if (!model || model.enabled || model.hasRealAdapter || model.status !== 'INSTALLATION ERFORDERLICH') {
              throw new Error('iOS model incorrectly marked ready: ' + id);
            }
            const toggle = await authFetch('/api/models/' + id + '/toggle', { method: 'POST' });
            if (![400, 409].includes(toggle.status)) throw new Error('Uninstalled iOS model can be enabled: ' + id);
          }
          const groundingFeature = models.find((entry) => entry.id === 'gemini-web-grounding');
          const groundingMetadata = String(groundingFeature?.provider ?? '') + String(groundingFeature?.limitations ?? '');
          if (!groundingFeature || groundingFeature.enabled || groundingFeature.testPassed ||
              !groundingMetadata.includes('gemini-2.5-flash-lite')) {
            throw new Error('Web grounding must remain disabled until a live free-tier test passes: ' + JSON.stringify(groundingFeature));
          }
          const serverSource = await (await import('node:fs/promises')).readFile('server.ts', 'utf8');
          if (!serverSource.includes("model: 'gemini-2.5-flash-lite'") || serverSource.includes("model: 'gemini-3.8-flash',\n        contents: `Recherchiere sachlich")) {
            throw new Error('Search requests are not isolated on the free-tier model');
          }
          const iosRuntime = await authFetch('/api/models/ios-runtime');
          const iosStatus = await iosRuntime.json();
          if (iosStatus.readyForDeployment !== false) throw new Error('iOS runtime claims readiness without model weights');
          const image = await authFetch('/api/image/generate', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: 'smoke test' })
          });
          if (image.status !== 503) throw new Error('Image route did not fail closed');
          const brain = await authFetch('/api/brain/chat', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ message: 'smoke test', modelId: 'gpt-oss-20b-free' })
          });
          if (brain.status !== 503) throw new Error('Unverified GPT-OSS route did not fail closed');
          const jsonBackupResponse = await authFetch('/api/system/backup', {
            method: 'POST', body: JSON.stringify({ note: 'CI PostgreSQL backup integration test' })
          });
          if (!jsonBackupResponse.ok) throw new Error('PostgreSQL JSON backup failed: ' + await jsonBackupResponse.text());
          const { backup: jsonBackup } = await jsonBackupResponse.json();
          if (!jsonBackup.id) throw new Error('JSON backup metadata missing');
          const zipBackupResponse = await authFetch('/api/system/zip-backups', {
            method: 'POST', body: JSON.stringify({ changelog: 'CI PostgreSQL ZIP backup integration test' })
          });
          if (!zipBackupResponse.ok) throw new Error('PostgreSQL ZIP backup failed: ' + await zipBackupResponse.text());
          const { backup: zipBackup } = await zipBackupResponse.json();
          const zipDownload = await authFetch('/api/system/zip-backups/' + zipBackup.id + '/download');
          if (!zipDownload.ok) throw new Error('PostgreSQL ZIP download failed');
          const zipBytes = Buffer.from(await zipDownload.arrayBuffer());
          if (zipBytes.length !== zipBackup.sizeBytes || zipBytes[0] !== 0x50 || zipBytes[1] !== 0x4b) {
            throw new Error('PostgreSQL ZIP backup bytes are missing or corrupted');
          }
