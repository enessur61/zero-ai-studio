name: prisma-deploy

on:
  push:
    branches:
      - prisma-cloud/setup-v3icl3cvq646n2a35puh95r3
  workflow_dispatch:

concurrency:
  group: prisma-preview-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    timeout-minutes: 5
    if: github.ref == 'refs/heads/prisma-cloud/setup-v3icl3cvq646n2a35puh95r3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: prisma/cloud-deploy-action@v1
        with:
          module: module.mjs
          build-command: bun run build
      - name: Verify isolated preview HTTP and PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          base="https://s5j2brwlvh3d4mkm2cyrycm5.fra.prisma.build"
          for attempt in $(seq 1 12); do
            if curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$base/api/health" -o /tmp/zero-health.json; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Preview health endpoint did not become ready."
              exit 1
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          with open("/tmp/zero-health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("ok") is True, "Preview health endpoint did not report ok=true"
          readiness = data.get("readiness", {})
          assert readiness.get("database") == "ready", "Preview PostgreSQL is not ready"
          assert readiness.get("authentication") == "ready", "Preview authentication is not ready"
          print("Preview HTTP health and isolated PostgreSQL readiness: PASS")
          PY
          curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$base/api/auth/status" -o /tmp/zero-auth-status.json
          python3 - <<'PY'
          import json
          with open("/tmp/zero-auth-status.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("required") is True, "Production-mode auth gate is not active"
          assert data.get("configured") is True, "Preview auth credentials are not configured"
          print("Preview authentication configuration gate: PASS")
          PY
