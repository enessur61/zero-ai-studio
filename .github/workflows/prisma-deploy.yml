name: prisma-deploy

on:
  push:
    branches:
      - prisma-cloud/setup-v3icl3cvq646n2a35puh95r3
  workflow_dispatch:

concurrency:
  group: prisma-preview-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    timeout-minutes: 5
    if: github.ref == 'refs/heads/prisma-cloud/setup-v3icl3cvq646n2a35puh95r3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: prisma/cloud-deploy-action@v1
        with:
          module: module.mjs
          build-command: bun run build
      - name: Verify isolated preview HTTP and PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          base="https://s5j2brwlvh3d4mkm2cyrycm5.fra.prisma.build"
          health_status="000"
          for attempt in $(seq 1 8); do
            health_status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error -o /tmp/zero-health.json -w '%{http_code}' "$base/api/health" || true)"
            if [ "$health_status" = "200" ]; then
              break
            fi
            sleep 5
          done
          echo "Preview /api/health HTTP status: $health_status"
          cat /tmp/zero-health.json || true
          auth_status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error -o /tmp/zero-auth-status.json -w '%{http_code}' "$base/api/auth/status" || true)"
          echo "Preview /api/auth/status HTTP status: $auth_status"
          cat /tmp/zero-auth-status.json || true
          python3 - <<'PY'
          import json
          with open("/tmp/zero-health.json", encoding="utf-8") as f:
              health = json.load(f)
          with open("/tmp/zero-auth-status.json", encoding="utf-8") as f:
              auth = json.load(f)
          assert health.get("ok") is True, "Preview health endpoint did not report ok=true"
          readiness = health.get("readiness", {})
          assert readiness.get("database") == "ready", "Preview PostgreSQL is not ready"
          assert readiness.get("authentication") == "ready", "Preview authentication is not ready"
          assert auth.get("required") is True, "Production-mode auth gate is not active"
          assert auth.get("configured") is True, "Preview auth credentials are not configured"
          print("Preview HTTP health, PostgreSQL and auth configuration: PASS")
          PY
