name: ZERO Llama Source Provenance Validator

on:
  pull_request:
    paths:
      - "tools/model-build/llama32-coreml/**"
      - "docs/architecture/LLAMA32_COREML_BUILD_SPEC.md"
      - ".github/workflows/llama-source-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run synthetic-only standard-library tests
        working-directory: tools/model-build/llama32-coreml
        run: python -m unittest -v
