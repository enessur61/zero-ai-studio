name: Core ML Python Toolchain Audit

on:
  pull_request:
    paths:
      - ".github/workflows/coreml-toolchain-audit.yml"
      - "tools/model-build/llama32-coreml/**"
      - "docs/architecture/LLAMA32_COREML_BUILD_SPEC.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreml-toolchain-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Resolve and verify CPU-only Python toolchain
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner, Xcode and iOS SDK identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ImageOS=\${ImageOS:-unknown}"
          echo "ImageVersion=\${ImageVersion:-unknown}"
          echo "architecture=$(uname -m)"
          test "$(uname -m)" = "arm64"
          test "\${ImageVersion:-}" = "20261123.0558.1"
          XCODE_OUTPUT="$(xcodebuild -version)"
          printf '%s\\n' "$XCODE_OUTPUT"
          grep -q '^Xcode 16\\.4$' <<< "$XCODE_OUTPUT"
          grep -q '^Build version 16F6$' <<< "$XCODE_OUTPUT"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_BUILD="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          echo "iOS SDK version=$SDK_VERSION build=$SDK_BUILD"
          test "$SDK_VERSION" = "18.5"
          test "$SDK_BUILD" = "22F76"

      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          architecture: "arm64"

      - name: Resolve, verify PyPI wheel hashes, install offline and smoke-test imports
        shell: bash
        run: |
          set -euo pipefail
          python tools/model-build/llama32-coreml/audit_toolchain.py

      - name: Build XcodeGen from the pinned source revision without cache
        shell: bash
        run: |
          set -euo pipefail
          XCODEGEN_DIR="$RUNNER_TEMP/XcodeGen-clean"
          PREFIX="$RUNNER_TEMP/xcodegen-clean"
          git init "$XCODEGEN_DIR"
          git -C "$XCODEGEN_DIR" remote add origin https://github.com/yonaskolb/XcodeGen.git
          git -C "$XCODEGEN_DIR" fetch --depth 1 origin 8445e778451c7e44237b90281bde622d764b0084
          git -C "$XCODEGEN_DIR" checkout --detach FETCH_HEAD
          ACTUAL_SOURCE="$(git -C "$XCODEGEN_DIR" rev-parse HEAD)"
          test "$ACTUAL_SOURCE" = "8445e778451c7e44237b90281bde622d764b0084"
          PWD="$XCODEGEN_DIR" make -C "$XCODEGEN_DIR" install PREFIX="$PREFIX"
          "$PREFIX/bin/xcodegen" --version
          shasum -a 256 "$PREFIX/bin/xcodegen" | tee "$RUNNER_TEMP/zero-coreml-toolchain-audit/xcodegen-binary.sha256"
          echo "XcodeGen source=$ACTUAL_SOURCE"

      - name: Upload candidate lock and toolchain provenance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-coreml-toolchain-audit
          path: \${{ runner.temp }}/zero-coreml-toolchain-audit/
          if-no-files-found: error
          retention-days: 14
