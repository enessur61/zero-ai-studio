name: ZERO Resource Guard PostgreSQL 16.16

on:
  pull_request:
    paths:
      - 'server/zeroCostResourceGuard.ts'
      - 'server/cloudflareWorkersAi.ts'
      - 'server/geminiClient.ts'
      - 'server/zeroCostGuard.ts'
      - 'server/adapters.ts'
      - 'components/SettingsView.tsx'
      - 'server.ts'
      - 'tests/zeroCostResourceGuard*.test.ts'
      - 'tests/videoStudioAuthUnmount.integration.test.mjs'
      - '.github/workflows/zero-resource-guard-integration.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-resource-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
        env:
          POSTGRES_USER: zero
          POSTGRES_PASSWORD: zero-test-password
          POSTGRES_DB: zero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zero -d zero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated React DOM test runtime (test-only)
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - run: npm run lint
      - run: npm test
      - name: ZERO resource guard PostgreSQL integration (no provider calls)
        env:
          DATABASE_URL: postgres://zero:zero-test-password@localhost:5432/zero_test
          ZERO_POSTGRES_TESTS: 'true'
        run: npx tsx tests/zeroCostResourceGuard.integration.test.ts
