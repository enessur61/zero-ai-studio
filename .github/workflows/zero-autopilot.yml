name: ZERO AUTOPILOT

on:
  workflow_dispatch:
    inputs:
      validation:
        description: "Welche Prüfung soll ZERO ausführen?"
        type: choice
        required: true
        default: full
        options:
          - full
          - dependencies
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: zero-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Record audit result
        if: always()
        run: |
          {
            echo "### ZERO AUTOPILOT — Dependency audit"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Scope: production dependencies only"
            echo "- No provider credentials or AI API calls are used."
          } >> "$GITHUB_STEP_SUMMARY"

  full-validation:
    name: Repository validation
    if: github.event_name == 'schedule' || inputs.validation == 'full'
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Record validation result
        if: always()
        run: |
          {
            echo "### ZERO AUTOPILOT — Repository validation"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- No deployment, merge, provider inference, or paid service is triggered."
          } >> "$GITHUB_STEP_SUMMARY"
