name: Temporary npm lockfile bootstrap

on:
  push:
    paths:
      - ".github/workflows/ci-lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean npm installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-npm-lockfile-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
