name: ZERO Native iOS App Build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/ZEROAIStudio/project.yml
      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/ZEROAIStudio/ZEROAIStudio.xcodeproj
          -scheme ZEROAIStudio
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build unsigned iPhone device app
        run: >-
          xcodebuild
          -project ios/ZEROAIStudio/ZEROAIStudio.xcodeproj
          -scheme ZEROAIStudio
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ZEROAIStudioDerived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA for AltStore signing
        run: |
          APP_PATH="$RUNNER_TEMP/ZEROAIStudioDerived/Build/Products/Release-iphoneos/ZERO AI STUDIO.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ZEROAIStudio-unsigned.ipa" Payload
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZEROAIStudio-unsigned-IPA
          path: ${{ runner.temp }}/ZEROAIStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
