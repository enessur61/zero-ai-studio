name: ZERO Native iOS App Build

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

jobs:
  build-ios-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/ZEROAIStudio/project.yml
      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/ZEROAIStudio/ZEROAIStudio.xcodeproj
          -scheme ZEROAIStudio
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
