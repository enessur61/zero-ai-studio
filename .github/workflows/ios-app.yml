name: ZERO Native iOS App Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-app.yml"

permissions:
  contents: read

# Keep only the latest native build for each PR/ref; stale simulator/device
# builds must not accumulate behind newer commits.
concurrency:
  group: zero-native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Validate native iOS changes on PRs and allow explicit manual runs.
  build-ios-app:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build pinned XcodeGen 2.46.0 from verified source commit
        shell: bash
        run: |
          set -euo pipefail
          XCODEGEN_DIR="$RUNNER_TEMP/XcodeGen"
          git init "$XCODEGEN_DIR"
          git -C "$XCODEGEN_DIR" remote add origin https://github.com/yonaskolb/XcodeGen.git
          git -C "$XCODEGEN_DIR" fetch --depth 1 origin 8445e778451c7e44237b90281bde622d764b0084
          git -C "$XCODEGEN_DIR" checkout --detach FETCH_HEAD
          # XcodeGen's Makefile uses the inherited PWD variable for its resource copy.
          # Set it explicitly because make -C alone does not update that environment variable.
          PWD="$XCODEGEN_DIR" make -C "$XCODEGEN_DIR" install PREFIX="$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          VERSION_OUTPUT="$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)"
          printf '%s\\n' "$VERSION_OUTPUT"
          [[ "$VERSION_OUTPUT" == *"2.46.0"* ]]
      - name: Run ZeroCoreML Swift 6 XCTest suite
        run: swift test --package-path ios/ZeroCoreML
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/ZEROAIStudio/project.yml
      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/ZEROAIStudio/ZEROAIStudio.xcodeproj
          -scheme ZEROAIStudio
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build unsigned iPhone device app
        run: >-
          xcodebuild
          -project ios/ZEROAIStudio/ZEROAIStudio.xcodeproj
          -scheme ZEROAIStudio
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ZEROAIStudioDerived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Verify ZERO_APP_URL is embedded in the native app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ZEROAIStudioDerived/Build/Products/Release-iphoneos/ZERO AI STUDIO.app"
          test -d "$APP_PATH"
          APP_URL="$(/usr/libexec/PlistBuddy -c 'Print :ZERO_APP_URL' "$APP_PATH/Info.plist")"
          [[ "$APP_URL" == "https://zero-ai-studio.onrender.com" ]]
          printf 'Verified ZERO_APP_URL in app bundle.\n'
      - name: Package unsigned IPA for AltStore signing
        run: |
          APP_PATH="$RUNNER_TEMP/ZEROAIStudioDerived/Build/Products/Release-iphoneos/ZERO AI STUDIO.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/ZEROAIStudio-unsigned.ipa" Payload
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZEROAIStudio-unsigned-IPA
          path: ${{ runner.temp }}/ZEROAIStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
